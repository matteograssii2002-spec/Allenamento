<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Allenamenti">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0C0E0D">
<title>Allenamenti</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
<link rel="icon" href="./assets/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
@font-face{
  font-family:'Archivo Variable';
  font-style:normal; font-display:swap;
  font-weight:100 900; font-stretch:62% 125%;
  src:url('./assets/archivo-var.woff2') format('woff2-variations');
}
:root{
  color-scheme:dark;
  --bg:#0C0E0D; --surf:#161918; --surf2:#212524;
  --fg:#F4F6F4; --fg2:rgba(244,246,244,.60); --fg3:rgba(244,246,244,.36);
  --line:rgba(244,246,244,.10); --line2:rgba(244,246,244,.055);
  --acc:#FF4B12; --volt:#D8FF3E;
  --sans:'Archivo Variable','Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
/* niente barra di scorrimento visibile (iOS + desktop) */
html,body{scrollbar-width:none;-ms-overflow-style:none}
*{scrollbar-width:none}
*::-webkit-scrollbar,html::-webkit-scrollbar,body::-webkit-scrollbar{width:0;height:0;display:none;-webkit-appearance:none;background:transparent}
body{color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(100px + env(safe-area-inset-bottom))}
.wrap{max-width:520px;margin:0 auto;padding:0 18px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.02em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none !important}
.num{font-variant-numeric:tabular-nums;font-weight:800;font-variation-settings:'wdth' 74;letter-spacing:-.02em}
.lab{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fg3);font-weight:600}

header{padding:calc(env(safe-area-inset-top,0px) + 22px) 0 16px;display:flex;align-items:center;gap:12px}
/* in app installata la status bar copre il contenuto: fallback se env() manca */
@media (display-mode:standalone){header{padding-top:calc(env(safe-area-inset-top,46px) + 22px)}}
header img{width:38px;height:32px;object-fit:contain;flex:none;opacity:.95}

.box{background:var(--surf);border-radius:18px;padding:22px 18px;margin-bottom:12px;text-align:center}
.box.flush{padding-left:0;padding-right:0}
.box .lab{margin-bottom:14px}

.big{font-size:clamp(72px,24vw,104px);line-height:.84;font-variation-settings:'wdth' 68;font-weight:900;letter-spacing:-.035em;transition:color .4s}
.big em{font-style:normal;font-size:.24em;font-variation-settings:'wdth' 90;font-weight:700;letter-spacing:.02em;color:var(--fg3);margin-left:.1em;vertical-align:.95em}
.big.done{color:var(--volt)}
.big.win{animation:pop .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.09)}100%{transform:scale(1)}}
.goal{display:flex;gap:5px;margin:20px auto 0;max-width:230px}
.goal i{flex:1;height:5px;border-radius:3px;background:var(--surf2);display:block;transition:background .3s}
.goal i.on{background:var(--volt)}
.sub{margin-top:14px;font-size:13.5px;color:var(--fg2)}
.sub2{margin-top:5px;font-size:12px;color:var(--fg3)}
.sub b,.sub2 b{color:var(--volt);font-weight:700}
.sub2 b.hi{color:var(--acc)}

.tri{display:grid;grid-template-columns:repeat(3,1fr);align-items:center}
.tri>div{padding:0 6px}
.tri>div+div{border-left:1px solid var(--line)}
.tri .v{font-size:25px}
.tri .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);margin-top:5px}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;padding:0 18px}
.week span{font-size:10px;color:var(--fg3);letter-spacing:.06em;display:block}
.week .bw{height:40px;display:flex;align-items:flex-end;margin-bottom:8px}
.week i{display:block;width:100%;height:40px;border-radius:7px;background:var(--surf2)}
.week .on i{background:var(--volt)}
.week .now span{color:var(--fg)}
.week .now i{box-shadow:inset 0 0 0 1.5px var(--fg2)}

/* proposta a un tocco */
.sugg{background:var(--surf);border-radius:18px;padding:18px 18px 18px 21px;margin-bottom:12px;display:flex;align-items:center;gap:14px;text-align:left;box-shadow:inset 3px 0 0 var(--c,var(--acc))}
.sugg .e{font-size:26px;flex:none}
.sugg .m{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.sugg .w{display:block;font-size:11.5px;color:var(--fg3);line-height:1.3}
.sugg .t{display:block;font-size:16px;font-weight:600;line-height:1.25}
.sugg .go{flex:none;background:var(--acc);color:#fff;border-radius:12px;padding:12px 15px;font-size:13.5px;font-weight:700;white-space:nowrap}
.sugg .go:active{opacity:.85}

.quad{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:12px}
.qb{background:var(--surf);border-radius:18px;padding:18px 10px;text-align:center;transition:transform .1s}
.qb:active{transform:scale(.96)}
.qb .em{font-size:24px;display:block;margin-bottom:7px}
.qb .t{font-size:13.5px;font-weight:600}
.qb .u{font-size:10.5px;color:var(--fg3);margin-top:3px;display:block}

.card{background:var(--surf);border-radius:18px;padding:18px 18px 8px;margin-bottom:12px;width:100%;display:block;position:relative;overflow:hidden;text-align:center}
.card::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--c,var(--acc))}
.card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.card .sport{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--c,var(--acc))}
.card .when{font-size:11px;color:var(--fg3)}
.card .name{font-size:17px;font-weight:600;margin:0 0 16px;letter-spacing:-.02em}
.card .m{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line2)}
.card .m>div{padding:14px 4px}
.card .m>div+div{border-left:1px solid var(--line2)}
.card .m .v{font-size:20px}
.card .m .k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);margin-top:3px}
.empty{background:var(--surf);border-radius:18px;padding:32px 24px;text-align:center}
.empty p{margin:0 0 6px;font-size:15px;font-weight:600}
.empty span{font-size:13px;color:var(--fg2);line-height:1.55}

.row{display:flex;gap:14px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line2);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .dot{width:8px;height:8px;border-radius:50%;flex:none}
.row .m{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t{display:block;font-size:15px;font-weight:500;line-height:1.3}
.row .s{display:block;font-size:12.5px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.row .r{font-size:11.5px;color:var(--fg3);text-align:right;flex:none;line-height:1.5}

nav{position:fixed;left:0;right:0;bottom:0;background:rgba(12,14,13,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:40}
.navin{max-width:520px;margin:0 auto;display:flex;align-items:center;padding:10px 12px 12px}
.tab{flex:1;text-align:center;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--fg3);padding:9px 0}
.tab.on{color:var(--fg)}
.fab{width:54px;height:54px;border-radius:50%;background:var(--acc);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;padding-bottom:3px;flex:none;margin:0 8px;box-shadow:0 8px 24px -8px rgba(255,75,18,.9);transition:transform .12s}
.fab:active{transform:scale(.9)}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg);border-radius:22px 22px 0 0;max-height:calc(94vh - env(safe-area-inset-top,0px));display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);border-top:1px solid var(--line)}
.sheet.show{transform:none}
.sheet-in{max-width:520px;margin:0 auto;width:100%;overflow-y:auto;padding:0 18px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.grab{width:38px;height:4px;border-radius:3px;background:var(--line);margin:9px auto 2px;flex:none}
.sheet-top{display:flex;justify-content:space-between;align-items:center;padding:14px 0 16px;position:sticky;top:0;background:var(--bg);z-index:2}
.sheet-top h2{font-size:21px}
.x{font-size:13px;color:var(--fg3);padding:6px}

.f{margin-bottom:14px}
.f>label{display:block;margin-bottom:7px;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fg3);font-weight:600}
.in{width:100%;min-width:0;display:block;background:var(--surf);border:1.5px solid transparent;border-radius:13px;padding:13px 15px;font-size:16px;line-height:1.3;min-height:50px;font-family:inherit}
input.in[type=date]{-webkit-appearance:none;appearance:none;text-align:left}
input.in[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
input.in::-webkit-calendar-picker-indicator{opacity:.45}
.in:focus{outline:none;border-color:var(--acc)}
textarea.in{min-height:78px;resize:vertical;line-height:1.5}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.g2>*,.g3>*,.pick>*{min-width:0}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick button{background:var(--surf);border-radius:14px;padding:15px 6px;font-size:12.5px;display:flex;flex-direction:column;gap:7px;align-items:center;border:1.5px solid transparent}
.pick button .em{font-size:21px}
.pick button.on{border-color:var(--fg);background:var(--surf2)}
.seg{display:flex;background:var(--surf);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;padding:10px 4px;font-size:13px;border-radius:10px;color:var(--fg2)}
.seg button.on{background:var(--surf2);color:var(--fg);font-weight:700;box-shadow:inset 0 0 0 1px var(--line)}
.cta{width:100%;background:var(--acc);color:#fff;border-radius:14px;padding:16px;font-size:15px;font-weight:700;margin-top:8px}
.cta:active{opacity:.85}
.cta.ghost{background:var(--surf);color:var(--fg2);font-weight:500;font-size:14px}
.cta.danger{background:none;color:var(--acc);font-size:13.5px;font-weight:600;padding:14px}

.ex{background:var(--surf);border-radius:14px;padding:14px;margin-bottom:8px}
.ex-top{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.ex-top input{flex:1;background:none;border:0;font-size:15.5px;font-weight:600;padding:2px 0;min-width:0}
.ex-top input:focus{outline:none}
.ex-del{color:var(--fg3);font-size:15px;padding:2px 4px;flex:none}
.sets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sets input{width:54px;text-align:center;background:var(--surf2);border:1.5px solid transparent;border-radius:10px;padding:10px 4px;font-size:16px;font-variant-numeric:tabular-nums;font-weight:600}
.sets input:focus{outline:none;border-color:var(--acc)}
.addset{background:none;border:1px dashed var(--line);border-radius:10px;padding:10px 13px;font-size:13px;color:var(--fg3)}
.ex-meta{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:12px;color:var(--fg3)}
.ex-meta input{width:62px;background:var(--surf2);border:0;border-radius:10px;padding:8px;font-size:14px;text-align:center}
.unit{display:flex;background:var(--surf2);border-radius:10px;padding:2px;gap:2px}
.unit button{padding:6px 10px;font-size:11px;border-radius:8px;color:var(--fg3);font-weight:600}
.unit button.on{background:var(--fg);color:var(--bg)}
.exadd{width:100%;background:none;border:1px dashed var(--line);border-radius:14px;padding:14px;font-size:14px;color:var(--fg2)}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.presets button{background:var(--surf);border-radius:999px;padding:8px 13px;font-size:13px;color:var(--fg2)}

.tot{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line2);border-radius:18px;overflow:hidden;margin-bottom:12px}
.tot>div{background:var(--surf);padding:18px 14px;text-align:center}
.tot .v{font-size:26px}
.tot .v em{font-style:normal;font-size:.44em;font-variation-settings:'wdth' 95;font-weight:600;color:var(--fg3);margin-left:2px}
.tot .k{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg3);margin-top:4px}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:18px;text-align:left}
.leg div{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--fg2);min-width:0}
.leg i{width:8px;height:8px;border-radius:2px;flex:none}
.leg b{color:var(--fg);font-weight:600;margin-left:auto;font-variant-numeric:tabular-nums}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.hm i{aspect-ratio:1;border-radius:2px;background:var(--surf2);display:block}
.hmleg{display:flex;gap:5px;align-items:center;justify-content:center;margin-top:14px;font-size:10.5px;color:var(--fg3)}
.hmleg i{width:9px;height:9px;border-radius:2px;display:block}
.rec{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line2);text-align:left}
.rec:last-child{border-bottom:0}
.rec .k{flex:1;font-size:14px;font-weight:500}
.rec .k small{display:block;color:var(--fg3);font-size:11.5px;font-weight:400;margin-top:1px}
.rec .v{font-size:18px;color:var(--acc)}
.hint{font-size:12.5px;color:var(--fg2);line-height:1.55;text-align:left}
.note{font-size:11.5px;color:var(--fg3);margin-top:12px;padding:0 4px;line-height:1.5}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 14px;padding:0 18px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.inner{margin:0 0 14px;padding:0 0 4px}
.chip{white-space:nowrap;background:var(--surf);border-radius:999px;padding:10px 15px;font-size:13.5px}
.chips.inner .chip{background:var(--surf2)}
.chip.on{background:var(--fg);color:var(--bg);font-weight:600}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px}
.delta{font-size:12.5px;color:var(--fg2);margin-top:10px}
.delta b{color:var(--volt);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(16px);bottom:calc(104px + env(safe-area-inset-bottom));background:var(--fg);color:var(--bg);padding:12px 20px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:60;opacity:0;transition:.22s;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>

<script>
/* ---------------- catalogo ---------------- */
const SPORTS = [
  {k:'calcetto',   n:'Calcetto',     e:'⚽', kind:'match',  met:8,   c:'#35C77E'},
  {k:'corsa',      n:'Corsa',        e:'🏃', kind:'cardio', met:9.8, c:'#4C9BFF'},
  {k:'corpolibero',n:'Corpo libero', e:'💪', kind:'reps',   met:6,   c:'#F0A23C'},
  {k:'palestra',   n:'Palestra',     e:'🏋️', kind:'reps',   met:5,   c:'#A98BFF', kg:true},
  {k:'bici',       n:'Bici',         e:'🚴', kind:'cardio', met:8,   c:'#34C6D4'},
  {k:'camminata',  n:'Camminata',    e:'🚶', kind:'cardio', met:3.8, c:'#9BC15A'},
  {k:'nuoto',      n:'Nuoto',        e:'🏊', kind:'cardio', met:7,   c:'#46B6F0'},
  {k:'padel',      n:'Padel',        e:'🎾', kind:'match',  met:7,   c:'#FFC24B'},
  {k:'basket',     n:'Basket',       e:'🏀', kind:'match',  met:6.5, c:'#FF8A4B'},
  {k:'tennis',     n:'Tennis',       e:'🎾', kind:'match',  met:7.3, c:'#A8DB4B'},
  {k:'sci',        n:'Sci',          e:'🎿', kind:'match',  met:7,   c:'#8FA8C4'},
  {k:'mobilita',   n:'Mobilità',     e:'🧘', kind:'match',  met:3,   c:'#C88BFF'},
  {k:'altro',      n:'Altro',        e:'✦',  kind:'match',  met:5,   c:'#93A0A0'}
];
const SP = Object.fromEntries(SPORTS.map(s=>[s.k,s]));
const PRESETS = ['Trazioni','Piegamenti','Squat','Affondi','Dip','Addominali','Plank','Burpee'];
const RPE = ['','molto leggero','leggero','medio','tosto','al limite'];
const DEF = {calcetto:'Partita',corsa:'Uscita',corpolibero:'Circuito a corpo libero',palestra:'Sessione pesi',bici:'Giro in bici',camminata:'Camminata',nuoto:'Vasche',padel:'Partita di padel',basket:'Partita',tennis:'Partita',sci:'Giornata sugli sci',mobilita:'Mobilità',altro:'Sessione'};

/* ---------------- archivio nel browser ---------------- */
const KEY='sportlog:v1';
const LS=(()=>{ try{ const k='__t'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return localStorage; }catch(e){ return null; } })();
let W=[], S={peso:75,obiettivo:3}, view='today', mem=null, saveT=null, win=false;

async function loadAll(){
  if(LS){ const raw=LS.getItem(KEY); if(raw){ try{ return JSON.parse(raw); }catch(e){} } }
  try{ const r=await window.storage.get(KEY); if(r) return JSON.parse(r.value); }catch(e){}
  return mem;
}
function saveAll(){
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    const data={v:1,settings:S,workouts:W}, str=JSON.stringify(data); mem=data;
    if(LS){ try{ LS.setItem(KEY,str); }catch(e){} }
    try{ await window.storage.set(KEY,str); }catch(e){}
  },250);
}

/* ---------------- util ---------------- */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const iso = d => new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fromISO = s => new Date(s+'T00:00:00');
const today = () => iso(new Date());
function sow(d){ const x=new Date(d); const w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); x.setHours(0,0,0,0); return x; }
const nf = (n,d=0)=> (isFinite(n)?n:0).toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d});
function hm(min){ min=Math.round(min||0); if(min<60) return min+'′'; const h=Math.floor(min/60), m=min%60; return m? h+'h '+String(m).padStart(2,'0') : h+'h'; }
function pace(min,km){ if(!min||!km) return null; const p=min/km, mm=Math.floor(p), ss=Math.round((p-mm)*60); return mm+"'"+String(ss).padStart(2,'0')+'"'; }
const DOW=['lun','mar','mer','gio','ven','sab','dom'], MON=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
function shortD(s){ const d=fromISO(s), y=new Date().getFullYear(), t=today();
  if(s===t) return 'oggi';
  const yd=new Date(); yd.setDate(yd.getDate()-1); if(s===iso(yd)) return 'ieri';
  return DOW[(d.getDay()+6)%7]+' '+d.getDate()+' '+MON[d.getMonth()]+(d.getFullYear()!==y?' '+d.getFullYear():''); }
function esc(s){ return String(s??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }
function median(a){ if(!a.length) return null; const s=[...a].sort((x,y)=>x-y); return s[Math.floor(s.length/2)]; }

/* ---------------- calcoli ---------------- */
function kcal(w){
  if(w.kcal) return w.kcal;
  const s=SP[w.sport]||SP.altro; let met=s.met;
  if(s.kind==='cardio'&&w.km&&w.min){ const kmh=w.km/(w.min/60);
    if(w.sport==='corsa') met=Math.max(4,0.98*kmh+0.35);
    else if(w.sport==='bici') met=Math.max(3,0.40*kmh);
    else if(w.sport==='camminata') met=Math.max(2.5,0.72*kmh+1.2); }
  if(w.rpe) met*=(0.865+w.rpe*0.045);
  return Math.round(met*3.5*(S.peso||75)/200*(w.min||0));
}
const reps = w => (w.ex||[]).filter(e=>e.u!=='sec').reduce((t,e)=>t+e.sets.reduce((a,b)=>a+(+b||0),0),0);
const secs = w => (w.ex||[]).filter(e=>e.u==='sec').reduce((t,e)=>t+e.sets.reduce((a,b)=>a+(+b||0),0),0);
const vol  = w => (w.ex||[]).reduce((t,e)=>t+(e.kg? e.sets.reduce((a,b)=>a+(+b||0),0)*e.kg : 0),0);
function agg(l){ const a={n:l.length,min:0,km:0,kcal:0,reps:0,vol:0};
  l.forEach(w=>{ a.min+=w.min||0; a.km+=w.km||0; a.kcal+=kcal(w); a.reps+=reps(w); a.vol+=vol(w); }); return a; }
function weekOf(d){ const s=sow(d), e=new Date(s); e.setDate(e.getDate()+7); return W.filter(w=>{const x=fromISO(w.date); return x>=s&&x<e;}); }
function streak(){ let n=0, cur=sow(new Date());
  const has=d=>W.some(w=>sow(fromISO(w.date)).getTime()===d.getTime());
  if(!has(cur)) cur.setDate(cur.getDate()-7);
  while(has(cur)){ n++; cur.setDate(cur.getDate()-7); } return n; }

/* abitudini: quanto dura di solito uno sport */
function usual(sport){
  const l=W.filter(w=>w.sport===sport).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);
  if(!l.length) return null;
  return { min: median(l.map(w=>w.min).filter(Boolean)),
           rpe: median(l.map(w=>w.rpe).filter(Boolean))||3,
           last: l[0], n:l.length };
}
/* proposta del giorno */
function suggestion(){
  if(!W.length || W.some(w=>w.date===today())) return null;
  const dow=(new Date().getDay()+6)%7, cnt={};
  W.forEach(w=>{ if(((fromISO(w.date).getDay()+6)%7)===dow) cnt[w.sport]=(cnt[w.sport]||0)+1; });
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  let sport, why;
  if(top && top[1]>=2){ sport=top[0]; why='Di solito il '+DOW[dow]+' fai'; }
  else { const last=[...W].sort((a,b)=>b.date.localeCompare(a.date))[0]; sport=last.sport; why='L\'ultima volta hai fatto'; }
  const u=usual(sport); if(!u) return null;
  return {sport, why, min:u.min, rpe:u.rpe};
}
/* carico settimanale: minuti pesati per intensità */
function loadIdx(){
  const wload = l => l.reduce((t,w)=>t+(w.min||0)*(w.rpe||3),0);
  const cur=wload(weekOf(new Date()));
  const prev=[]; for(let i=1;i<=4;i++){ const d=new Date(); d.setDate(d.getDate()-i*7); prev.push(wload(weekOf(d))); }
  const past=prev.filter(v=>v>0);
  if(past.length<2 || !cur) return null;
  const avg=past.reduce((a,b)=>a+b,0)/past.length;
  const frac=Math.max(0.3,(((new Date().getDay()+6)%7)+1)/7);
  return { pct: Math.round((cur/frac/avg-1)*100) };
}
function avgSessions(){
  const v=[]; for(let i=1;i<=8;i++){ const d=new Date(); d.setDate(d.getDate()-i*7); v.push(weekOf(d).length); }
  const nz=v.filter(x=>x>0); return nz.length>=2 ? v.reduce((a,b)=>a+b,0)/v.length : null;
}
function metrics(w){
  const s=SP[w.sport]||SP.altro;
  if(s.kind==='cardio') return [[w.km?nf(w.km,2):'—','km'],[w.min?hm(w.min):'—','tempo'],[pace(w.min,w.km)||nf(kcal(w)),pace(w.min,w.km)?'passo':'kcal']];
  if(s.kind==='reps'){ const r=reps(w), v=vol(w), sc=secs(w);
    return [[r?nf(r):(sc?sc+'″':'—'), r?'ripetizioni':'isometria'],[w.min?hm(w.min):'—','tempo'],[v?nf(v):nf(kcal(w)), v?'kg volume':'kcal']]; }
  return [[w.min?hm(w.min):'—','tempo'],[nf(kcal(w)),'kcal'],[String(w.rpe||3),'intensità']];
}
function sub(w){ const s=SP[w.sport]||SP.altro, p=[];
  if(w.min) p.push(hm(w.min)); if(w.km) p.push(nf(w.km,1)+' km');
  if(s.kind==='cardio'&&w.km&&w.min) p.push(pace(w.min,w.km)+'/km');
  const r=reps(w), sc=secs(w); if(r) p.push(r+' rip'); if(sc) p.push(sc+'″');
  if(vol(w)) p.push(nf(vol(w))+' kg'); if(w.fc) p.push(w.fc+' bpm'); if(w.disl) p.push('+'+w.disl+' m');
  return p.join(' · '); }
function exStats(){
  const m={};
  W.forEach(w=>(w.ex||[]).forEach(e=>{
    const k=(e.name||'').trim(); if(!k) return;
    const b=Math.max(0,...e.sets.map(Number)); if(!b) return;
    (m[k]=m[k]||[]).push({d:w.date,b,u:e.u,tot:e.sets.reduce((x,y)=>x+(+y||0),0)});
  }));
  Object.values(m).forEach(a=>a.sort((x,y)=>x.d.localeCompare(y.d)));
  return m;
}
function records(){
  const o=[], runs=W.filter(w=>w.sport==='corsa'&&w.km);
  if(runs.length){ const lg=runs.reduce((a,b)=>b.km>a.km?b:a); o.push({k:'Corsa più lunga',s:shortD(lg.date),v:nf(lg.km,1)+' km'});
    const ok=runs.filter(w=>w.km>=3&&w.min);
    if(ok.length){ const f=ok.reduce((a,b)=>(b.min/b.km)<(a.min/a.km)?b:a); o.push({k:'Passo migliore',s:'su '+nf(f.km,1)+' km · '+shortD(f.date),v:pace(f.min,f.km)}); } }
  const best={};
  W.forEach(w=>(w.ex||[]).forEach(e=>{ const m=Math.max(0,...e.sets.map(Number)), key=(e.name||'').trim().toLowerCase();
    if(m&&(!best[key]||m>best[key].v)) best[key]={v:m,name:e.name,u:e.u,date:w.date}; }));
  Object.values(best).sort((a,b)=>b.v-a.v).slice(0,4).forEach(b=>o.push({k:b.name,s:'miglior serie · '+shortD(b.date),v:b.v+(b.u==='sec'?'″':' rip')}));
  const long=W.filter(w=>w.min).sort((a,b)=>b.min-a.min)[0];
  if(long) o.push({k:'Sessione più lunga',s:(SP[long.sport]||SP.altro).n+' · '+shortD(long.date),v:hm(long.min)});
  const byW={}; W.forEach(w=>{ const k=iso(sow(fromISO(w.date))); byW[k]=(byW[k]||0)+1; });
  const bw=Object.entries(byW).sort((a,b)=>b[1]-a[1])[0];
  if(bw) o.push({k:'Settimana più piena',s:'dal '+shortD(bw[0]),v:bw[1]+' sessioni'});
  return o;
}

/* ---------------- grafici ---------------- */
function barsSVG(data,opt={}){
  const n=data.length, W0=336, pad=4, slot=(W0-pad*2)/n, bw=Math.min(24,slot-8);
  const mx=Math.max(opt.min||30,...data.map(d=>d.v));
  return `<svg viewBox="0 0 ${W0} 116" style="width:100%;height:116px;display:block" aria-hidden="true">
    ${data.map((d,i)=>{ const h=Math.max(3,d.v/mx*82), x=pad+slot*i+(slot-bw)/2, y=94-h, cur=i===n-1;
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="${cur?'var(--acc)':'rgba(244,246,244,.20)'}"/>
      ${d.v?`<text x="${(x+bw/2).toFixed(1)}" y="${(y-6).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${cur?'var(--acc)':'rgba(244,246,244,.45)'}">${d.t||d.v}</text>`:''}
      <text x="${(x+bw/2).toFixed(1)}" y="109" text-anchor="middle" font-size="9" fill="rgba(244,246,244,.34)">${d.l}</text>`}).join('')}
  </svg>`;
}
function donutSVG(items,total){
  const R=54, C=2*Math.PI*R; let off=0;
  const segs=items.map(it=>{ const len=Math.max(0,it.v/total*C-3);
    const s=`<circle r="${R}" fill="none" stroke="${it.c}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"/>`;
    off+=it.v/total*C; return s; }).join('');
  return `<svg viewBox="0 0 150 150" style="width:170px;height:170px;display:block;margin:0 auto" aria-hidden="true">
    <circle cx="75" cy="75" r="${R}" fill="none" stroke="var(--surf2)" stroke-width="16"/>
    <g transform="translate(75,75) rotate(-90)">${segs}</g>
    <text x="75" y="72" text-anchor="middle" font-size="26" font-weight="800" fill="var(--fg)" style="font-variant-numeric:tabular-nums">${hm(total)}</text>
    <text x="75" y="89" text-anchor="middle" font-size="9.5" letter-spacing="1.2" fill="rgba(244,246,244,.36)">IN MOVIMENTO</text>
  </svg>`;
}
function lineSVG(pts,col){
  col=col||'var(--acc)';
  const W0=336, H=112, mx=Math.max(1,...pts.map(p=>p.v)), n=pts.length;
  const X=i=> n===1? W0/2 : 18+i*((W0-36)/(n-1)), Y=v=> 88-(v/mx)*70;
  const d=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  const id='g'+Math.random().toString(36).slice(2,7);
  return `<svg viewBox="0 0 ${W0} ${H}" style="width:100%;height:${H}px;display:block" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${col}" stop-opacity=".28"/><stop offset="100%" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <line x1="0" y1="88.5" x2="${W0}" y2="88.5" stroke="var(--line)"/>
    ${n>1?`<path d="${d} L${X(n-1).toFixed(1)},88 L${X(0).toFixed(1)},88 Z" fill="url(#${id})"/>
    <path d="${d}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`:''}
    ${pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${i===n-1?4.5:3}" fill="${i===n-1?col:'var(--bg)'}" stroke="${col}" stroke-width="2"/>
      <text x="${X(i).toFixed(1)}" y="${(Y(p.v)-11).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${i===n-1?col:'rgba(244,246,244,.45)'}">${p.v}</text>
      <text x="${X(i).toFixed(1)}" y="105" text-anchor="middle" font-size="9" fill="rgba(244,246,244,.34)">${p.l}</text>`).join('')}
  </svg>`;
}

let period=90, exSel=null;
function renderStats(){
  const from=new Date(); from.setDate(from.getDate()-period+1); from.setHours(0,0,0,0);
  const list=period===9999? W : W.filter(w=>fromISO(w.date)>=from);
  const a=agg(list), by={};
  list.forEach(w=>{ const k=w.sport||'altro'; if(!by[k]) by[k]={n:0,min:0}; by[k].n++; by[k].min+=w.min||0; });
  const ord=Object.entries(by).filter(o=>o[1].min>0).sort((x,y)=>y[1].min-x[1].min);
  const items=ord.map(([k,v])=>({c:(SP[k]||SP.altro).c, v:v.min}));
  const totMin=items.reduce((t,i)=>t+i.v,0);
  const bars=[]; for(let i=11;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i*7); const s=sow(d);
    bars.push({v:Math.round(agg(weekOf(d)).min), l:s.getDate()+'/'+(s.getMonth()+1)}); }
  const months=[]; for(let i=5;i>=0;i--){ const d=new Date(); d.setMonth(d.getMonth()-i,1);
    months.push({v:W.filter(w=>{const x=fromISO(w.date); return x.getMonth()===d.getMonth()&&x.getFullYear()===d.getFullYear();}).length, l:MON[d.getMonth()]}); }
  const first=W.length? W.reduce((m,w)=>w.date<m?w.date:m,today()) : today();
  const nWeeks=period===9999? Math.max(1,(Date.now()-fromISO(first))/6048e5) : period/7;

  const cells=[], end=sow(new Date()); end.setDate(end.getDate()+6);
  const start=new Date(end); start.setDate(start.getDate()-26*7+1);
  const pd={}; W.forEach(w=>pd[w.date]=(pd[w.date]||0)+(w.min||30));
  for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
    const k=iso(d), v=pd[k]||0, op=v?Math.min(1,.3+v/110*.7):0;
    cells.push(`<i title="${k}"${v?` style="background:var(--volt);opacity:${op.toFixed(2)}"`:''}></i>`); }

  const ex=exStats();
  const exNames=Object.entries(ex).filter(([,v])=>v.length>=2).sort((x,y)=>y[1].length-x[1].length).map(([k])=>k).slice(0,6);
  if(!exNames.includes(exSel)) exSel=exNames[0]||null;
  let exBlock='';
  if(exSel){
    const h=ex[exSel].slice(-8), u=h[h.length-1].u;
    const pts=h.map(p=>({v:p.b, l:fromISO(p.d).getDate()+'/'+(fromISO(p.d).getMonth()+1)}));
    const d0=h[0].b, d1=h[h.length-1].b, diff=d1-d0;
    exBlock=`<div class="box flush"><div class="lab">Progressione, miglior serie</div>
      <div style="padding:0 18px"><div class="chips inner">${exNames.map(n=>`<button class="chip ${n===exSel?'on':''}" data-ex-sel="${esc(n)}">${esc(n)}</button>`).join('')}</div></div>
      ${lineSVG(pts,'var(--volt)')}
      <div class="note" style="padding:0 18px">${h.length} sessioni con ${esc(exSel)}. ${diff>0?`Da ${d0} a ${d1}${u==='sec'?' secondi':' ripetizioni'}, <b style="color:var(--volt)">+${diff}</b> da ${shortD(h[0].d)}.`:diff<0?`Sei passato da ${d0} a ${d1}: la miglior serie è più bassa di quella di ${shortD(h[0].d)}.`:`Miglior serie ferma a ${d1}${u==='sec'?' secondi':' ripetizioni'}.`}</div></div>`;
  }
  const rec=records();

  $('#v-stats').innerHTML=`
  <div class="seg" style="margin-bottom:12px">${[[30,'30 giorni'],[90,'3 mesi'],[365,'1 anno'],[9999,'Sempre']].map(([v,l])=>`<button data-p="${v}" class="${period==v?'on':''}">${l}</button>`).join('')}</div>
  <div class="tot">
    <div><div class="v num">${a.n}</div><div class="k">allenamenti</div></div>
    <div><div class="v num">${nf(a.n/nWeeks,1)}</div><div class="k">a settimana</div></div>
    <div><div class="v num">${nf(a.km,1)}<em>km</em></div><div class="k">percorsi</div></div>
    <div><div class="v num">${nf(a.kcal)}<em>kcal</em></div><div class="k">bruciate</div></div>
    <div><div class="v num">${nf(a.reps)}</div><div class="k">ripetizioni</div></div>
    <div><div class="v num">${nf(a.vol/1000,1)}<em>t</em></div><div class="k">sollevate</div></div>
  </div>

  <div class="box"><div class="lab">Come si divide il tempo</div>
    ${totMin? donutSVG(items,totMin)+`<div class="leg">${ord.map(([k,v])=>{const s=SP[k]||SP.altro;
      return `<div><i style="background:${s.c}"></i>${s.n}<b>${Math.round(v.min/totMin*100)}%</b></div>`}).join('')}</div>`
     : `<div class="hint" style="text-align:center">Nessun allenamento nel periodo scelto.</div>`}</div>

  <div class="box flush"><div class="lab">Minuti per settimana, ultime dodici</div>${barsSVG(bars)}</div>
  <div class="box flush"><div class="lab">Allenamenti al mese, ultimi sei</div>${lineSVG(months)}</div>
  ${exBlock}
  <div class="box"><div class="lab">Costanza, ventisei settimane</div>
    <div class="hm">${cells.join('')}</div>
    <div class="hmleg">meno <i style="background:var(--surf2)"></i><i style="background:var(--volt);opacity:.4"></i><i style="background:var(--volt);opacity:.7"></i><i style="background:var(--volt)"></i> più</div></div>

  <div class="box" style="text-align:left"><div class="lab" style="text-align:center">Record personali</div>
    ${rec.length? rec.map(r=>`<div class="rec"><span class="k">${esc(r.k)}<small>${esc(r.s)}</small></span><span class="v num">${r.v}</span></div>`).join('')
     : `<div class="hint">I record compaiono appena registri qualche sessione.</div>`}</div>`;
}

  requestAnimationFrame(()=>{ $('#scrim').classList.add('show'); $('#sheet').classList.add('show'); }); }
function closeSheet(){ $('#scrim').classList.remove('show'); $('#sheet').classList.remove('show');
  setTimeout(()=>{ $('#scrim').hidden=true; $('#sheet').hidden=true; $('#sheetIn').innerHTML=''; },300); draft=null; }
function newDraft(sport){
  const d={id:uid(),date:today(),sport:sport||'',title:'',min:null,km:null,kcal:null,fc:null,disl:null,rpe:3,ex:[],note:''};
  if(sport){ const u=usual(sport); if(u){ d.min=u.min; d.rpe=u.rpe; } }
  if(sport&&SP[sport]&&SP[sport].kind==='reps'){
    const u=usual(sport);
    d.ex = u&&u.last&&(u.last.ex||[]).length
      ? u.last.ex.map(e=>({name:e.name,sets:e.sets.map(()=>null),u:e.u,kg:e.kg}))
      : [{name:'',sets:[null],u:'rip',kg:null}];
  }
  return d;
}
function editor(){
  const d=draft, s=SP[d.sport], kind=s?s.kind:null;
  const head=SPORTS.slice(0,4).concat(s&&!SPORTS.slice(0,4).some(x=>x.k===d.sport)?[s]:[]);
  return `<div class="sheet-top"><h2>${d._new?'Nuovo allenamento':'Modifica'}</h2><button class="x" data-close>Chiudi</button></div>
  ${!s? `<div class="f"><label>Che cosa hai fatto</label><div class="pick">${SPORTS.map(x=>`<button data-sport="${x.k}"><span class="em">${x.e}</span>${x.n}</button>`).join('')}</div></div>` : `
  <div class="f"><div class="pick" style="grid-template-columns:repeat(${head.length+1},1fr)">
    ${head.map(x=>`<button data-sport="${x.k}" class="${x.k===d.sport?'on':''}"><span class="em">${x.e}</span>${x.n}</button>`).join('')}
    <button data-sport="__"><span class="em">···</span>Altri</button></div></div>
  <div class="g2">
    <div class="f"><label>Data</label><input class="in" type="date" data-fld="date" value="${d.date}"></div>
    <div class="f"><label>Durata · min</label><input class="in" type="number" inputmode="numeric" data-fld="min" value="${d.min??''}" placeholder="60"></div>
  </div>
  ${kind==='cardio'? `<div class="g3">
    <div class="f"><label>Km</label><input class="in" type="number" step="0.01" inputmode="decimal" data-fld="km" value="${d.km??''}" placeholder="5,2"></div>
    <div class="f"><label>FC media</label><input class="in" type="number" inputmode="numeric" data-fld="fc" value="${d.fc??''}" placeholder="—"></div>
    <div class="f"><label>Disliv. m</label><input class="in" type="number" inputmode="numeric" data-fld="disl" value="${d.disl??''}" placeholder="—"></div>
  </div>`:''}
  ${kind==='reps'? `<div class="f"><label>Esercizi</label>
    <div id="exList">${d.ex.map(exHTML).join('')}</div>
    <button class="exadd" data-exadd>+ Aggiungi esercizio</button>
    <div class="presets">${PRESETS.map(p=>`<button data-preset="${p}">${p}</button>`).join('')}</div></div>`:''}
  <div class="f"><label>Intensità · ${RPE[d.rpe]||'medio'}</label>
    <div class="seg">${[1,2,3,4,5].map(i=>`<button data-rpe="${i}" class="${d.rpe==i?'on':''}">${i}</button>`).join('')}</div></div>
  <div class="g2">
    <div class="f"><label>Calorie</label><input class="in" type="number" inputmode="numeric" data-fld="kcal" value="${d.kcal??''}" placeholder="${kcal({...d,kcal:null})} stimate"></div>
    <div class="f"><label>Titolo</label><input class="in" data-fld="title" value="${esc(d.title)}" placeholder="${DEF[d.sport]||s.n}"></div>
  </div>
  <div class="f"><label>Note</label><textarea class="in" data-fld="note" placeholder="Com'è andata, con chi, cosa migliorare…">${esc(d.note)}</textarea></div>
  <button class="cta" data-save>${d._new?'Salva allenamento':'Salva modifiche'}</button>
  ${d._new?'':`<button class="cta ghost" data-dup>Ripeti oggi questa sessione</button><button class="cta danger" data-del>Elimina</button>`}
  <div style="height:14px"></div>`}`;
}
function exHTML(e,i){
  return `<div class="ex" data-ex="${i}">
    <div class="ex-top"><input value="${esc(e.name)}" data-exname placeholder="Nome esercizio" list="exNames"><button class="ex-del" data-exdel>✕</button></div>
    <div class="sets">${e.sets.map((v,j)=>`<input type="number" inputmode="numeric" value="${v??''}" data-set="${j}">`).join('')}<button class="addset" data-addset>+ serie</button></div>
    <div class="ex-meta"><span class="unit"><button data-u="rip" class="${e.u!=='sec'?'on':''}">rip</button><button data-u="sec" class="${e.u==='sec'?'on':''}">sec</button></span>
      <span>zavorra</span><input type="number" inputmode="decimal" value="${e.kg??''}" data-exkg placeholder="kg"><span>kg</span></div>
  </div>`;
}
function refreshEditor(){ const s=$('#sheetIn').scrollTop; $('#sheetIn').innerHTML=editor(); $('#sheetIn').scrollTop=s; }

function settingsSheet(){
  return `<div class="sheet-top"><h2>Profilo</h2><button class="x" data-close>Chiudi</button></div>
  <div class="g2">
    <div class="f"><label>Peso · kg</label><input class="in" type="number" inputmode="decimal" data-set-peso value="${S.peso}"></div>
    <div class="f"><label>Obiettivo settimanale</label><input class="in" type="number" inputmode="numeric" data-set-ob value="${S.obiettivo}"></div>
  </div>
  <div class="hint" style="margin-bottom:24px">Il peso serve solo a stimare le calorie quando non le scrivi tu. L'obiettivo sono le sessioni che vuoi fare in una settimana.</div>
  <div class="lab" style="margin-bottom:10px">Archivio</div>
  <div class="hint">${W.length} ${W.length===1?'allenamento salvato':'allenamenti salvati'} nella memoria di questo browser. Restano qui anche chiudendo l'app, finché non cancelli i dati del sito.</div>
  <div style="height:20px"></div>`;
}

/* ---------------- routing ---------------- */
function go(t){ view=t;
  ['today','stats','log'].forEach(x=>$('#v-'+x).hidden = x!==t);
  document.querySelectorAll('.tab[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  $('#hTitle').textContent={today:'Allenamenti',stats:'I numeri',log:'Storico'}[t];
  if(t==='today')renderToday(); if(t==='stats')renderStats(); if(t==='log')renderLog();
  window.scrollTo(0,0);
}
function toast(m){ const e=$('#toast'); e.textContent=m; e.classList.add('show'); setTimeout(()=>e.classList.remove('show'),2200); }
function refreshAll(){ view==='today'?renderToday(): view==='stats'?renderStats():renderLog(); }
function commit(n,msg){
  const before=weekOf(new Date()).length;
  const i=W.findIndex(x=>x.id===n.id); i>=0? W[i]=n : W.push(n);
  const after=weekOf(new Date()).length;
  if(before<S.obiettivo && after>=S.obiettivo && fromISO(n.date)>=sow(new Date())){ win=true; msg='Obiettivo della settimana raggiunto'; }
  saveAll(); refreshAll(); toast(msg);
}

document.addEventListener('click', e=>{
  const t=e.target.closest('[data-tab],[data-add],[data-quick],[data-edit],[data-open],[data-close],[data-sport],[data-rpe],[data-save],[data-del],[data-dup],[data-exadd],[data-exdel],[data-addset],[data-preset],[data-u],[data-p],[data-filt],[data-ex-sel]');
  if(!t) return; const k=t.dataset;
  if(k.tab) return go(k.tab);
  if(k.p!==undefined){ period=+k.p; return renderStats(); }
  if(k.exSel!==undefined){ exSel=k.exSel; return renderStats(); }
  if(k.filt!==undefined){ filt=k.filt; return renderLog(); }
  if(t.hasAttribute('data-close')) return closeSheet();
  if(k.open==='settings') return openSheet(settingsSheet());
  if(k.quick){ const u=usual(k.quick); if(!u) return;
    const n=newDraft(k.quick);
    if(u.last&&(u.last.ex||[]).length) n.ex=JSON.parse(JSON.stringify(u.last.ex));
    if(u.last&&u.last.km) n.km=u.last.km;
    return commit(n,'Registrato: '+SP[k.quick].n); }
  if(k.add!==undefined){ draft=newDraft(k.add); draft._new=true; return openSheet(editor()); }
  if(k.edit){ const w=W.find(x=>x.id===k.edit); if(w){ draft=JSON.parse(JSON.stringify(w)); draft._new=false; openSheet(editor()); } return; }
  if(k.sport!==undefined&&draft){
    if(k.sport==='__') draft.sport='';
    else { const keep={date:draft.date,note:draft.note,title:draft.title};
      draft=Object.assign(newDraft(k.sport),{id:draft.id,_new:draft._new},keep); }
    return refreshEditor(); }
  if(k.rpe&&draft){ draft.rpe=+k.rpe; return refreshEditor(); }
  if(t.hasAttribute('data-exadd')&&draft){ draft.ex.push({name:'',sets:[null],u:'rip',kg:null}); return refreshEditor(); }
  if(k.preset&&draft){ draft.ex.push({name:k.preset,sets:[null],u:/plank/i.test(k.preset)?'sec':'rip',kg:null}); return refreshEditor(); }
  if(t.hasAttribute('data-exdel')&&draft){ draft.ex.splice(+t.closest('[data-ex]').dataset.ex,1); return refreshEditor(); }
  if(t.hasAttribute('data-addset')&&draft){ const i=+t.closest('[data-ex]').dataset.ex, s=draft.ex[i].sets; s.push(s[s.length-1]??null); return refreshEditor(); }
  if(k.u&&draft){ draft.ex[+t.closest('[data-ex]').dataset.ex].u=k.u; return refreshEditor(); }
  if(t.hasAttribute('data-save')&&draft){
    if(!draft.sport) return toast('Scegli lo sport');
    draft.ex=(draft.ex||[]).filter(x=>x.name.trim()||x.sets.some(v=>+v>0));
    draft.ex.forEach(x=>{ if(!x.name.trim()) x.name='Esercizio'; x.sets=x.sets.filter(v=>+v>0); });
    if(!draft.min&&!draft.km&&!draft.ex.length) return toast('Serve almeno la durata');
    const n={...draft}, isNew=draft._new; delete n._new;
    closeSheet(); return commit(n, isNew?'Allenamento registrato':'Modifiche salvate'); }
  if(t.hasAttribute('data-dup')&&draft){ const n=JSON.parse(JSON.stringify(draft)); n.id=uid(); n.date=today(); delete n._new;
    closeSheet(); return commit(n,'Sessione ripetuta oggi'); }
  if(t.hasAttribute('data-del')&&draft){ W=W.filter(x=>x.id!==draft.id); saveAll(); closeSheet(); refreshAll(); return toast('Eliminato'); }
});
$('#scrim').addEventListener('click', closeSheet);
$('#fab').addEventListener('click', ()=>{ draft=newDraft(''); draft._new=true; openSheet(editor()); });

document.addEventListener('input', e=>{
  const el=e.target;
  if(el.dataset.fld&&draft){ const f=el.dataset.fld, v=el.value;
    draft[f]=['min','km','kcal','fc','disl'].includes(f)?(v===''?null:parseFloat(v.replace(',','.'))):v; return; }
  if(draft&&el.closest('[data-ex]')){
    const i=+el.closest('[data-ex]').dataset.ex, ex=draft.ex[i];
    if(el.hasAttribute('data-exname')) ex.name=el.value;
    else if(el.hasAttribute('data-exkg')) ex.kg=el.value===''?null:parseFloat(el.value.replace(',','.'));
    else if(el.dataset.set!==undefined) ex.sets[+el.dataset.set]=el.value===''?null:+el.value;
    return; }
  if(el.hasAttribute('data-set-peso')){ S.peso=+el.value||75; saveAll(); }
  if(el.hasAttribute('data-set-ob')){ S.obiettivo=+el.value||3; saveAll(); }
});

(async function init(){
  const d=new Date();
  $('#hDate').textContent = DOW[(d.getDay()+6)%7]+' '+d.getDate()+' '+MON[d.getMonth()];
  const data=await loadAll();
  if(data){ if(Array.isArray(data.workouts)) W=data.workouts; if(data.settings) S={...S,...data.settings}; saveAll(); }
  const dl=document.createElement('datalist'); dl.id='exNames';
  [...new Set([...PRESETS,...W.flatMap(x=>(x.ex||[]).map(e=>e.name))])].filter(Boolean)
    .forEach(n=>{ const o=document.createElement('option'); o.value=n; dl.appendChild(o); });
  document.body.appendChild(dl);
  go('today');
  if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('./sw.js'); }catch(e){} }
})();
</script>
</html>
